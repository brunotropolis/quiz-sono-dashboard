<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel dos Quizzes · Sono do Bebê</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --roxo-900:#23103f; --roxo-700:#3d1a5b; --magenta:#c4147a;
  --pink:#ff4f9a; --pink-soft:#ff7ab5; --laranja:#ff8a3d; --laranja-soft:#ffb37a;
  --verde:#34d399; --azul:#6db3f2;
  --texto:#f5edff; --texto-suave:rgba(245,237,255,.72);
  --card:rgba(255,255,255,.07); --borda:rgba(255,255,255,.14);
  --grad:linear-gradient(100deg,var(--pink) 0%,var(--laranja) 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Quicksand',sans-serif;color:var(--texto);
  background:linear-gradient(165deg,var(--roxo-900) 0%,var(--roxo-700) 55%,#7c1a64 130%);
  min-height:100vh;padding:28px 18px 60px;position:relative;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.deco{position:fixed;z-index:0;pointer-events:none}
.twinkle{animation:tw 3.4s ease-in-out infinite}
.twinkle.d1{animation-delay:.9s}.twinkle.d2{animation-delay:1.8s}
@keyframes tw{0%,100%{opacity:.22}50%{opacity:.9}}
.glow{position:fixed;z-index:0;border-radius:50%;filter:blur(100px);opacity:.4;pointer-events:none}
.wrap{max-width:980px;margin:0 auto;position:relative;z-index:2}

/* header */
.head{text-align:center;margin-bottom:24px}
.head .tag{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  padding:7px 18px;border-radius:100px;background:rgba(255,138,61,.18);
  border:1px solid rgba(255,138,61,.4);color:var(--laranja-soft);margin-bottom:14px;
}
.head h1{font-family:'Cardo',serif;font-size:clamp(28px,5vw,40px);letter-spacing:.02em}
.head h1 span{color:var(--pink-soft)}
.head p{color:var(--texto-suave);font-size:14px;margin-top:6px}
.btn-refresh{
  margin-top:18px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;color:#fff;
  background:var(--grad);border:none;border-radius:100px;padding:11px 26px;cursor:pointer;
  box-shadow:0 10px 28px rgba(255,79,154,.38);transition:transform .2s;
}
.btn-refresh:hover{transform:translateY(-2px)}
.btn-refresh:disabled{opacity:.6;cursor:default;transform:none}
.atualizado{font-size:12px;color:var(--texto-suave);margin-top:10px}

/* seletor de quiz (nivel 1) */
.quiz-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.qbtn{
  font-family:'Quicksand',sans-serif;font-weight:700;font-size:13.5px;color:var(--texto-suave);
  background:rgba(0,0,0,.22);border:1px solid var(--borda);border-radius:100px;
  padding:10px 18px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;
}
.qbtn:hover{color:#fff;border-color:rgba(255,255,255,.32)}
.qbtn.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(255,79,154,.35)}

/* seletor origem (nivel 2) */
.seletor{display:inline-flex;gap:4px;margin-top:16px;padding:4px;background:rgba(0,0,0,.22);border:1px solid var(--borda);border-radius:100px}
.seg{font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;color:var(--texto-suave);background:none;border:none;border-radius:100px;padding:9px 18px;cursor:pointer;transition:all .2s}
.seg:hover{color:#fff}
.seg.active{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,79,154,.35)}
@media(max-width:560px){.seg{padding:8px 12px;font-size:12px}.qbtn{padding:9px 14px;font-size:12.5px}}

/* estados */
.loading,.erro{text-align:center;padding:70px 20px;color:var(--texto-suave)}
.spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--pink);margin:0 auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{
  background:var(--card);border:1px solid var(--borda);border-radius:18px;
  padding:22px 16px;text-align:center;backdrop-filter:blur(6px);
}
.kpi .n{font-family:'Cardo',serif;font-size:clamp(30px,5vw,42px);font-weight:700;color:#fff;line-height:1}
.kpi .n.pink{color:var(--pink-soft)}.kpi .n.verde{color:var(--verde)}.kpi .n.laranja{color:var(--laranja-soft)}
.kpi .l{font-size:12px;font-weight:600;color:var(--texto-suave);margin-top:8px;text-transform:uppercase;letter-spacing:.06em}

/* secoes */
.sec{background:var(--card);border:1px solid var(--borda);border-radius:22px;padding:26px;margin-bottom:20px;backdrop-filter:blur(6px)}
.sec h2{font-family:'Cardo',serif;font-size:20px;margin-bottom:6px;color:#fff}
.sec .sub{font-size:13px;color:var(--texto-suave);margin-bottom:20px}

/* funil */
.step{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;margin-bottom:5px;background:rgba(0,0,0,.22);border-radius:10px;position:relative;overflow:hidden}
.step .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(109,179,242,.35),rgba(74,144,217,.5));border-radius:10px;transition:width .7s ease;z-index:0}
.step .lbl,.step .val{position:relative;z-index:1;font-size:14px}
.step .lbl{font-weight:600}
.step .val{font-weight:700;color:#fff;white-space:nowrap;margin-left:10px}
.step .val .pct{color:var(--azul);font-size:12px;margin-left:7px}
.drop{color:var(--pink-soft);font-size:11.5px;font-weight:700;padding:2px 14px 6px;opacity:.85}

/* perfis */
.pf-row{display:flex;align-items:center;gap:14px;padding:9px 0}
.pf-row .emo{width:40px;font-size:30px;text-align:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.pf-row .nome{min-width:84px;font-weight:700;font-size:14px}
.pf-row .barbox{flex:1;height:14px;background:rgba(0,0,0,.25);border-radius:100px;overflow:hidden}
.pf-row .barfill{display:block;height:100%;border-radius:100px;background:var(--grad);transition:width .7s ease}
.pf-row .ct{min-width:66px;text-align:right;font-weight:700;font-size:14px}
.pf-row .ct small{color:var(--texto-suave);font-weight:600;font-size:12px}

/* respostas */
.aq{margin-bottom:18px}
.aq .qt{font-size:13px;font-weight:700;color:var(--laranja-soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em}
.arow{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:4px;background:rgba(0,0,0,.22);border-radius:8px;position:relative;overflow:hidden}
.arow .abar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(196,20,122,.4),rgba(255,79,154,.45));border-radius:8px;transition:width .6s ease;z-index:0}
.arow .al{position:relative;z-index:1;font-size:13px}
.arow .av{position:relative;z-index:1;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;margin-left:10px}
.empty{text-align:center;color:var(--texto-suave);font-size:13.5px;padding:14px;line-height:1.6}

/* visao geral - lista de quizzes */
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:rgba(0,0,0,.22);border:1px solid var(--borda);border-radius:14px;
  cursor:pointer;transition:all .2s;text-align:left;width:100%;font-family:'Quicksand',sans-serif;color:var(--texto)
}
.qcard:hover{border-color:rgba(255,255,255,.32);transform:translateY(-1px)}
.qcard .qemo{font-size:28px;line-height:1}
.qcard .qmeta{flex:1;min-width:0}
.qcard .qname{font-weight:700;font-size:15px;color:#fff}
.qcard .qdesc{font-size:12px;color:var(--texto-suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcard .qnums{display:flex;gap:18px;flex-shrink:0}
.qcard .qnum{text-align:center}
.qcard .qnum b{display:block;font-family:'Cardo',serif;font-size:20px;color:#fff;line-height:1}
.qcard .qnum span{font-size:10.5px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:560px){.qcard .qnums{gap:12px}.qcard .qdesc{display:none}}
</style>
</head>
<body>

<div class="glow" style="width:520px;height:520px;background:#c4147a;top:-180px;right:-140px"></div>
<div class="glow" style="width:420px;height:420px;background:#5b2d8f;bottom:-160px;left:-130px"></div>
<svg class="deco twinkle" style="top:8%;left:7%" width="18" height="18" viewBox="0 0 24 24"><path d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6L12 1z" fill="#ffd9bb"/></svg>
<svg class="deco twinkle d1" style="top:16%;right:9%" width="13" height="13" viewBox="0 0 24 24"><path d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6L12 1z" fill="#fff"/></svg>
<svg class="deco twinkle d2" style="bottom:14%;left:11%" width="15" height="15" viewBox="0 0 24 24"><path d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6L12 1z" fill="#ff7ab5"/></svg>

<div class="wrap">
  <div class="head">
    <span class="tag">✨ Painel dos Quizzes</span>
    <h1>Quiz Sono <span>do Bebê</span></h1>
    <p>Métricas em tempo real de todos os quizzes</p>

    <div class="quiz-nav" id="quizNav"></div>
    <div id="origemWrap" style="display:none">
      <div class="seletor" id="seletor">
        <button class="seg active" data-f="tudo">Tudo</button>
        <button class="seg" data-f="pago">📢 Tráfego pago</button>
        <button class="seg" data-f="organico">🌱 Orgânico</button>
      </div>
    </div>

    <div><button class="btn-refresh" id="btn">↻ Atualizar dados</button></div>
    <div class="atualizado" id="ts"></div>
  </div>

  <div class="loading" id="loading"><div class="spin"></div>Carregando métricas...<br><small style="opacity:.7">A primeira carga pode levar alguns segundos.</small></div>
  <div class="erro" id="erro" style="display:none">Não consegui carregar os dados agora. <br>Tente atualizar em alguns segundos.</div>
  <div id="content" style="display:none"></div>
</div>

<script>
const TRACKING_URL = 'https://script.google.com/macros/s/AKfycbzh-GOfXA6A8tYKfn7U8fK4MXYI40M5CKMyTPergH9EqvjYGF2j5LbFQE68LhMKsQFm/exec';

// Cada quiz: qual(is) quiz_version do backend agrega, se tem origem pago/organico e se tem clique (CTR)
const QUIZZES = [
  { id:'perfis', label:'Dream Baby Pocket', emoji:'🌙', desc:'perfis.manualdorecemnascido.com.br',
    versions:{ tudo:['perfis-pago','perfis-organico','perfis'], pago:['perfis-pago'], organico:['perfis-organico'] },
    origem:true, clique:true },
  { id:'aluna', label:'Aluna', emoji:'🎓', desc:'quiz.manualdorecemnascido.com.br',
    versions:{ tudo:['aluna'] }, origem:false, clique:false },
  { id:'quizclube', label:'Quiz Clube', emoji:'⭐', desc:'quizclube.manualdorecemnascido.com.br',
    versions:{ tudo:['quizclube'] }, origem:false, clique:false }
];

const ANIMALS = [
  { nome:'Canguru', e:'🦘' },
  { nome:'Coala', e:'🐨' },
  { nome:'Coruja', e:'🦉' },
  { nome:'Leão', e:'🦁' },
  { nome:'Suricato', e:'🐾' },
  { nome:'Preguiça', e:'🦥' }
];

// Rotulos das perguntas/opcoes — especificos do quiz "perfis" (Dream Baby Pocket)
const QLABELS = {
  q1:{ t:'Idade do bebê', o:['Até 30 dias / não nasceu','01 a 03 meses','03 a 06 meses','06 a 09 meses','09 a 12 meses'] },
  q2:{ t:'Sonecas do dia', o:['Só dorme no colo','Dorme bem no berço de dia','Faz sonecas, mas precisa mais','Quase não dorme, irritado'] },
  q3:{ t:'Sono noturno', o:['Só no colo / deitado comigo','Dorme bem, muitos despertares','À noite dorme bem no berço'] },
  q4:{ t:'Qualidade do sono', o:['Colo profundo, berço acorda','Dia profundo, noite leve','Noite profundo, dia leve','Dia e noite leve','Dorme bem em qualquer lugar'] },
  q5:{ t:'MAIOR dificuldade', o:['Fazer dormir fora do colo / berço','Sono da noite / despertares','Sonecas do dia','Ajudar a relaxar (dia e noite)','Não tenho dificuldade'] }
};

let STATS_RAW = {};        // resposta crua do Apps Script (por quiz_version)
let QUIZ_ATUAL = 'geral';  // geral | perfis | aluna | convite | quizclube
let ORIGEM = 'tudo';       // tudo | pago | organico (só perfis)

function n(v){ return (v||0).toLocaleString('pt-BR'); }
function vazio(){ return { total:0, started:0, total_clicks:0, profiles:{}, clicks:{}, questions:{}, answers:{} }; }
function somaMapa(dst, src){ Object.keys(src||{}).forEach(function(k){ dst[k]=(dst[k]||0)+src[k]; }); }
function mergeVersoes(keys){
  var out = vazio();
  (keys||[]).forEach(function(k){
    var s = STATS_RAW[k]; if(!s) return;
    out.total += s.total||0; out.started += s.started||0; out.total_clicks += s.total_clicks||0;
    somaMapa(out.profiles, s.profiles); somaMapa(out.clicks, s.clicks);
    somaMapa(out.questions, s.questions); somaMapa(out.answers, s.answers);
  });
  return out;
}
function cfg(id){ return QUIZZES.find(function(q){ return q.id===id; }); }

// ---------- navegação ----------
function montarNav(){
  var nav = document.getElementById('quizNav');
  var botoes = '<button class="qbtn" data-q="geral">📊 Visão geral</button>';
  QUIZZES.forEach(function(q){
    botoes += '<button class="qbtn" data-q="'+q.id+'">'+q.emoji+' '+q.label+'</button>';
  });
  nav.innerHTML = botoes;
  nav.addEventListener('click', function(e){
    var b = e.target.closest('.qbtn'); if(!b) return;
    selecionarQuiz(b.getAttribute('data-q'));
  });
}
function selecionarQuiz(id){
  QUIZ_ATUAL = id;
  [].forEach.call(document.querySelectorAll('.qbtn'), function(x){
    x.classList.toggle('active', x.getAttribute('data-q')===id);
  });
  var c = cfg(id);
  document.getElementById('origemWrap').style.display = (c && c.origem) ? 'block' : 'none';
  desenhar();
}

// ---------- render ----------
function desenhar(){
  if(!Object.keys(STATS_RAW).length) return;
  if(QUIZ_ATUAL==='geral'){ renderGeral(); return; }
  var c = cfg(QUIZ_ATUAL);
  var keys = c.origem ? c.versions[ORIGEM] : c.versions.tudo;
  renderQuiz(c, mergeVersoes(keys));
}

function renderGeral(){
  var totStarted=0, totFinal=0, totClicks=0, trackedStarted=0, trackedFinal=0;
  var linhas='';
  QUIZZES.forEach(function(q){
    var s = mergeVersoes(q.versions.tudo);
    totStarted += s.started; totFinal += s.total; totClicks += s.total_clicks;
    if(s.started>0){ trackedStarted += s.started; trackedFinal += s.total; }
    var conc = s.started>0 ? ((s.total/s.started)*100).toFixed(1)+'%' : '—';
    linhas += '<button class="qcard" data-q="'+q.id+'">'
      + '<span class="qemo">'+q.emoji+'</span>'
      + '<span class="qmeta"><span class="qname">'+q.label+'</span><span class="qdesc">'+q.desc+'</span></span>'
      + '<span class="qnums">'
        + '<span class="qnum"><b>'+n(s.started)+'</b><span>Iniciou</span></span>'
        + '<span class="qnum"><b>'+n(s.total)+'</b><span>Finalizou</span></span>'
        + '<span class="qnum"><b>'+conc+'</b><span>Conclusão</span></span>'
      + '</span></button>';
  });
  var concGeral = trackedStarted>0 ? ((trackedFinal/trackedStarted)*100).toFixed(1)+'%' : '—';

  var html = '<div class="kpis">'
    + '<div class="kpi"><div class="n pink">'+n(totStarted)+'</div><div class="l">Iniciaram</div></div>'
    + '<div class="kpi"><div class="n">'+n(totFinal)+'</div><div class="l">Finalizaram</div></div>'
    + '<div class="kpi"><div class="n laranja">'+n(totClicks)+'</div><div class="l">Clicaram</div></div>'
    + '<div class="kpi"><div class="n verde">'+concGeral+'</div><div class="l">Conclusão média</div></div>'
    + '</div>';
  html += '<div class="sec"><h2>Quizzes</h2><div class="sub">Toque em um quiz para ver o detalhe</div><div class="qlist">'+linhas+'</div></div>';

  var el = document.getElementById('content');
  el.innerHTML = html;
  el.querySelector('.qlist').addEventListener('click', function(e){
    var b = e.target.closest('.qcard'); if(!b) return;
    selecionarQuiz(b.getAttribute('data-q'));
  });
}

function renderQuiz(c, s){
  var started=s.started||0, total=s.total||0, clicks=s.total_clicks||0;
  var conc = started>0 ? ((total/started)*100).toFixed(1)+'%' : '—';
  var ctr = total>0 ? ((clicks/total)*100).toFixed(1)+'%' : '—';
  var ehPerfis = (c.id==='perfis');

  var html='';

  // KPIs
  html+='<div class="kpis">'
    +'<div class="kpi"><div class="n pink">'+n(started)+'</div><div class="l">Iniciaram</div></div>'
    +'<div class="kpi"><div class="n">'+n(total)+'</div><div class="l">Finalizaram</div></div>'
    +'<div class="kpi"><div class="n verde">'+conc+'</div><div class="l">Conclusão</div></div>';
  if(c.clique){
    html+='<div class="kpi"><div class="n laranja">'+ctr+'</div><div class="l">Clicaram (CTR)</div></div>';
  }else{
    html+='<div class="kpi"><div class="n laranja">'+n(total)+'</div><div class="l">Leads</div></div>';
  }
  html+='</div>';

  // Funil
  var q=s.questions||{};
  var labFunil = ehPerfis
    ? ['Respondeu Q1 · idade','Respondeu Q2 · sonecas','Respondeu Q3 · noite','Respondeu Q4 · qualidade']
    : ['Respondeu Q1','Respondeu Q2','Respondeu Q3','Respondeu Q4'];
  var steps=[
    {l:'Iniciou o quiz', c:started},
    {l:labFunil[0], c:q.q1||0},
    {l:labFunil[1], c:q.q2||0},
    {l:labFunil[2], c:q.q3||0},
    {l:labFunil[3], c:q.q4||0},
    {l:'Finalizou (Q5)', c:total}
  ];
  if(c.clique) steps.push({l:'Clicou em comprar', c:clicks});
  var topo=Math.max.apply(null,steps.map(function(x){return x.c;}).concat([1]));
  var temFunil = started>0 || (q.q1||0)+(q.q2||0)+(q.q3||0)+(q.q4||0)>0;
  html+='<div class="sec"><h2>Funil de desistência</h2><div class="sub">Onde as mães param o quiz</div>';
  if(temFunil){
    steps.forEach(function(st,i){
      var pct = started>0 ? ((st.c/started)*100).toFixed(1) : '';
      var w=(st.c/topo)*100;
      html+='<div class="step"><div class="bar" style="width:'+w+'%"></div>'
        +'<span class="lbl">'+st.l+'</span>'
        +'<span class="val">'+n(st.c)+(started>0?'<span class="pct">'+pct+'%</span>':'')+'</span></div>';
      if(i<steps.length-1){
        var drop=st.c-steps[i+1].c;
        if(drop>0&&st.c>0){
          html+='<div class="drop">↓ −'+n(drop)+' ('+((drop/st.c)*100).toFixed(1)+'% saíram aqui)</div>';
        }
      }
    });
  } else if(total>0){
    html+='<div class="empty">Esse quiz não rastreia o funil passo a passo — só o resultado final ('+n(total)+' finalizações).</div>';
  } else {
    html+='<div class="empty">Ainda sem dados. Assim que o quiz começar a receber visitas, o funil aparece aqui.</div>';
  }
  html+='</div>';

  // Perfis
  var prof=s.profiles||{};
  var maxP=Math.max.apply(null,ANIMALS.map(function(p){return prof[p.nome]||0;}).concat([1]));
  var temPerfil = ANIMALS.some(function(p){ return (prof[p.nome]||0)>0; });
  html+='<div class="sec"><h2>Resultado por perfil</h2><div class="sub">Qual bichinho cada bebê recebeu</div>';
  if(temPerfil){
    ANIMALS.forEach(function(p){
      var ct=prof[p.nome]||0;
      var pct = total>0 ? Math.round((ct/total)*100) : 0;
      html+='<div class="pf-row"><span class="emo">'+p.e+'</span>'
        +'<span class="nome">'+p.nome+'</span>'
        +'<span class="barbox"><span class="barfill" style="width:'+((ct/maxP)*100)+'%"></span></span>'
        +'<span class="ct">'+n(ct)+' <small>'+pct+'%</small></span></div>';
    });
  } else {
    html+='<div class="empty">Sem resultados por perfil ainda.</div>';
  }
  html+='</div>';

  // Principais respostas (só perfis — os rótulos das opções são desse quiz)
  if(ehPerfis){
    var ans=s.answers||{};
    html+='<div class="sec"><h2>Principais respostas</h2><div class="sub">O que elas respondem em cada pergunta</div>';
    var temAlguma=false;
    ['q1','q2','q3','q4','q5'].forEach(function(qk){
      var def=QLABELS[qk]; if(!def) return;
      var counts=def.o.map(function(label,i){ return {label:label, c:ans[qk+'_o'+(i+1)]||0}; });
      var totQ=counts.reduce(function(a,b){return a+b.c;},0);
      if(!totQ) return;
      temAlguma=true;
      html+='<div class="aq"><div class="qt">'+qk.toUpperCase()+' · '+def.t+'</div>';
      counts.forEach(function(cc){
        var pct = totQ>0 ? Math.round((cc.c/totQ)*100) : 0;
        html+='<div class="arow"><div class="abar" style="width:'+pct+'%"></div>'
          +'<span class="al">'+cc.label+'</span><span class="av">'+n(cc.c)+' · '+pct+'%</span></div>';
      });
      html+='</div>';
    });
    if(!temAlguma){
      html+='<div class="empty">As respostas detalhadas aparecem aqui assim que o quiz começar a receber visitas.</div>';
    }
    html+='</div>';
  }

  document.getElementById('content').innerHTML=html;
}

// ---------- carregamento ----------
// O Apps Script reprocessa dezenas de milhares de linhas por chamada e pode levar 20-40s.
// Guardamos o último resultado bom no navegador pra mostrar na hora e atualizar em 2o plano.
var CACHE_KEY = 'dashquiz_stats_v1';

function load(){
  var cached=null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
  var temCache = cached && cached.stats && Object.keys(cached.stats).length;

  if(temCache){
    STATS_RAW = cached.stats;
    document.getElementById('loading').style.display='none';
    desenhar();
    document.getElementById('content').style.display='block';
    document.getElementById('ts').textContent='Dados de '+new Date(cached.at).toLocaleTimeString('pt-BR')+' · atualizando…';
  } else {
    document.getElementById('loading').style.display='block';
    document.getElementById('content').style.display='none';
  }
  document.getElementById('erro').style.display='none';
  var btn=document.getElementById('btn'); btn.disabled=true;

  // credentials:'omit' é ESSENCIAL: sem isso o navegador manda cookies do Google e,
  // com várias contas logadas, o Apps Script devolve 404 na conta errada (o "dados não sobem").
  fetch(TRACKING_URL, {credentials:'omit'}).then(function(r){return r.json();}).then(function(data){
    STATS_RAW = data.stats || {};
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({stats:STATS_RAW, at:Date.now()})); }catch(e){}
    btn.disabled=false;
    document.getElementById('loading').style.display='none';
    desenhar();
    document.getElementById('content').style.display='block';
    document.getElementById('ts').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');
  }).catch(function(e){
    btn.disabled=false;
    if(temCache){
      document.getElementById('ts').textContent='Dados de '+new Date(cached.at).toLocaleTimeString('pt-BR')+' (não consegui atualizar agora)';
    } else {
      document.getElementById('loading').style.display='none';
      document.getElementById('erro').style.display='block';
    }
    console.error(e);
  });
}

document.getElementById('btn').addEventListener('click', load);
document.getElementById('seletor').addEventListener('click', function(e){
  var b = e.target.closest('.seg'); if(!b) return;
  ORIGEM = b.getAttribute('data-f');
  [].forEach.call(this.querySelectorAll('.seg'), function(x){ x.classList.toggle('active', x===b); });
  desenhar();
});

montarNav();
selecionarQuiz('geral');
load();
</script>
